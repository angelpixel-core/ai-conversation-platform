name: CI Pipeline

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

# Concurrency handling to avoid collisions during consecutive commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install ruff
      - name: Run Ruff Lint
        run: ruff check src tests
      - name: Run Ruff Format Check
        run: ruff format --check src tests

  typecheck:
    name: Static Type Check (Pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install .[dev]
      - name: Run Pyright
        run: pyright

  security-sast:
    name: Security Analysis (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install bandit
      - name: Run Bandit SAST
        run: bandit -r src -s B101

  test-and-coverage:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install .[dev]
      - name: Run Tests with Coverage
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml
      - name: Verify OpenAPI & ReDoc Build
        run: python -m src.interfaces.cli.export_openapi
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  publish-docs:
    name: Publish OpenAPI Docs (GitHub Pages)
    runs-on: ubuntu-latest
    needs: [test-and-coverage, typecheck, lint-and-format]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install .[dev]
      - name: Export OpenAPI Schema & HTML
        run: python -m src.interfaces.cli.export_openapi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4