name: CI Pipeline

on:
  push:
    branches: [ main, development, "feat/**", "feature/**", "refactor/**" ]
  pull_request:
    branches: [ main, development ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-format:
    name: Lint & Format Check (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install ruff
      - name: Run Ruff Format Check
        run: ruff format --check src tests
      - name: Run Ruff Lint
        run: ruff check src tests

  static-analysis:
    name: Static Analysis (Pyright & Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install .[dev]
      - name: Run Pyright Type Check
        run: pyright
      - name: Run Bandit Security SAST
        run: bandit -r src -s B101

  test-unit-and-integration:
    name: Unit & Integration Tests (MSSQL + RabbitMQ)
    runs-on: ubuntu-latest
    services:
      db:
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
          - 1433:1433
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "YourStrong@Password123"
          MSSQL_PID: "Developer"
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Password123' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 15s

      broker:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        env:
          RABBITMQ_DEFAULT_USER: "guest"
          RABBITMQ_DEFAULT_PASS: "guest"
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    env:
      DATABASE_URL: "mssql+pymssql://sa:YourStrong%40Password123@localhost:1433/ChatbotDB"
      BROKER_URL: "amqp://guest:guest@localhost:5672/"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install .[dev]
      - name: Apply Database Migrations (Alembic)
        run: alembic upgrade head
      - name: Run Tests with Coverage
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docs-validation:
    name: OpenAPI & ReDoc Documentation Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install .[dev]
      - name: Export OpenAPI Schema & HTML
        run: python -m src.interfaces.cli.export_openapi
      - name: Validate Generated Artifacts
        run: |
          test -f public/openapi.json || (echo "Missing public/openapi.json" && exit 1)
          test -f public/index.html || (echo "Missing public/index.html" && exit 1)
          python -c "import json; data = json.load(open('public/openapi.json')); assert data['openapi'].startswith('3.')"
      - uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: public/

  docker-build-and-push:
    name: Docker Build & Verification
    runs-on: ubuntu-latest
    needs: [lint-and-format, static-analysis, test-unit-and-integration, docs-validation]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: chatbot-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-docs:
    name: Publish OpenAPI Docs (GitHub Pages)
    runs-on: ubuntu-latest
    needs: [docs-validation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Documentation Artifacts
        uses: actions/download-artifact@v4
        with:
          name: api-docs
          path: public
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4