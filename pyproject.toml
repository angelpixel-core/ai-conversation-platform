[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-conversation-platform"
version = "0.1.0"
description = "AI conversation platform reference implementation — Slice 1"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "httpx>=0.27,<1.0",
  "sqlmodel>=0.0.22,<1.0",
  "alembic>=1.13,<2.0",
  "pymssql>=2.3.0,<3.0",
]

[project.scripts]
export-openapi = "src.interfaces.cli.export_openapi:cli_main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-cov>=5.0,<7.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.6,<1.0",
  "pyright>=1.1,<2.0",
  "bandit>=1.7,<2.0",
  "pip-audit>=2.7,<3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --import-mode=importlib"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::Warning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C90", # mccabe complexity
    "S",   # flake8-bandit (security)
    "UP",  # pyupgrade
]
ignore = ["S101", "B024"]  # Allow assert in tests and base classes without abstract methods

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/infrastructure/persistence/mssql/migrations"]
extraPaths = ["."]
venvPath = "."
venv = ".venv"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "src/infrastructure/persistence/mssql/migrations/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
