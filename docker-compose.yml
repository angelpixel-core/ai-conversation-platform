services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot_api
    ports:
      - "8000:8000"
    environment:
      - PERSISTENCE_DRIVER=mssql
      - MESSAGING_DRIVER=rabbitmq
      - DB_SERVER=db
      - DB_PORT=1433
      - DB_NAME=ChatbotDB
      - DB_USER=sa
      - DB_PASSWORD=YourStrong@Password123
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot_worker
    command: ["python", "-m", "src.worker"]
    environment:
      - PERSISTENCE_DRIVER=mssql
      - MESSAGING_DRIVER=rabbitmq
      - DB_SERVER=db
      - DB_PORT=1433
      - DB_NAME=ChatbotDB
      - DB_USER=sa
      - DB_PASSWORD=YourStrong@Password123
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql_db
    user: root
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Password123
    volumes:
      - mssql_data:/var/opt/mssql/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Password123' -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_broker
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  mssql_data:
  rabbitmq_data:
